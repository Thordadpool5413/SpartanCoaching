openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: |
    Partial OpenAPI surface for SpartanCoaching.

    **Not the full product contract.** Authoritative routes live in
    `artifacts/api-server` (Express + Zod). See `docs/api-contract.md`.

    This file documents stable public endpoints used by web and mobile clients.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workspace
    description: Workspace guidance operations
  - name: billing
    description: Membership billing operations
  - name: admin
    description: Administrative operations
  - name: analytics
    description: Product analytics operations
paths:
  /knowledge-control/{scopeKind}/commands:
    post:
      operationId: executeKnowledgeCommand
      tags:
      - knowledge-control
      summary: Mutate durable knowledge authority
      description: 'Disabled by default. Cookie-first or native Bearer session authentication is enforced by the server. Tenant scope and knowledge authority are derived server-side; product roles do not grant knowledge authority. Sensitive responses use Cache-Control: no-store. No source-content retrieval or ingestion.'
      parameters:
      - name: scopeKind
        in: path
        required: true
        schema:
          type: string
          enum:
          - global
          - tenant
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Retry an uncertain outcome only with the same key and payload.
      responses:
        '200':
          description: Authorized bounded result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCommandResult'
        '400':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '401':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '403':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '404':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '409':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '413':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '429':
          description: Existing shared API rate limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string}
                required: [error]
                additionalProperties: false
        '503':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeControlCommand'
  /knowledge-control/{scopeKind}/scope:
    get:
      operationId: getKnowledgeScope
      tags:
      - knowledge-control
      summary: Read authorized knowledge scope configuration
      description: 'Disabled by default. Cookie-first or native Bearer session authentication is enforced by the server. Tenant scope and knowledge authority are derived server-side; product roles do not grant knowledge authority. Sensitive responses use Cache-Control: no-store. No source-content retrieval or ingestion.'
      parameters:
      - name: scopeKind
        in: path
        required: true
        schema:
          type: string
          enum:
          - global
          - tenant
      responses:
        '200':
          description: Authorized bounded result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeScopeResult'
        '400':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '401':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '403':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '404':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '409':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '413':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '429':
          description: Existing shared API rate limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string}
                required: [error]
                additionalProperties: false
        '503':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
  /knowledge-control/{scopeKind}/metadata:
    get:
      operationId: getKnowledgeMetadata
      tags:
      - knowledge-control
      summary: Read authorized bounded knowledge metadata
      description: 'Disabled by default. Cookie-first or native Bearer session authentication is enforced by the server. Tenant scope and knowledge authority are derived server-side; product roles do not grant knowledge authority. Sensitive responses use Cache-Control: no-store. No source-content retrieval or ingestion.'
      parameters:
      - name: scopeKind
        in: path
        required: true
        schema:
          type: string
          enum:
          - global
          - tenant
      - name: kind
        in: query
        required: true
        schema:
          type: string
          enum:
          - sources
          - versions
          - assignments
          - approvals
      - name: domain
        in: query
        required: true
        schema: &id001
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
      - name: versionId
        in: query
        required: false
        schema: *id001
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 512
      responses:
        '200':
          description: Authorized bounded result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeMetadataResult'
        '400':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '401':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '403':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '404':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '409':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '413':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
        '429':
          description: Existing shared API rate limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string}
                required: [error]
                additionalProperties: false
        '503':
          description: Bounded error code; no request or database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeControlError'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/workspace/next-move:
    get:
      operationId: getWorkspaceNextMove
      tags: [workspace]
      summary: Get the next recommended workspace move
      responses:
        "200":
          description: A privacy-safe next move recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceNextMoveResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Create an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200": { description: Session created, content: { application/json: { schema: { $ref: "#/components/schemas/SessionEnvelope" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200": { description: Session ended, content: { application/json: { schema: { $ref: "#/components/schemas/OkEnvelope" } } } }
  /auth/me:
    get:
      operationId: getSession
      tags: [auth]
      responses:
        "200": { description: Current session, content: { application/json: { schema: { $ref: "#/components/schemas/SessionEnvelope" } } } }
  /v1/coach/conversations:
    get:
      operationId: listCoachConversations
      tags: [coach]
      responses:
        "200": { description: Conversations, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationsEnvelope" } } } }
    post:
      operationId: createCoachConversation
      tags: [coach]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { title: { type: string, minLength: 1, maxLength: 160 } }, additionalProperties: false } } } }
      responses:
        "201": { description: Created conversation, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationEnvelope" } } } }
  /v1/coach/conversations/{id}:
    get:
      operationId: getCoachConversation
      tags: [coach]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Conversation and messages, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationDetailEnvelope" } } } }
    delete:
      operationId: deleteCoachConversation
      tags: [coach]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/OkEnvelope" } } } } }
  /v1/member-sync:
    get:
      operationId: getMemberSync
      tags: [member]
      parameters: [{ name: since, in: query, schema: { type: string, description: ISO-8601 timestamp transport value } }]
      responses:
        "200": { description: Sync state, content: { application/json: { schema: { $ref: "#/components/schemas/MemberSyncGetResponse" } } } }
    post:
      operationId: postMemberSync
      tags: [member]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MemberSyncRequest" } } } }
      responses: { "200": { description: Sync result, content: { application/json: { schema: { $ref: "#/components/schemas/MemberSyncPostResponse" } } } } }
  /v1/member-work:
    get:
      operationId: listMemberWork
      tags: [member]
      responses: { "200": { description: Saved work, content: { application/json: { schema: { $ref: "#/components/schemas/ItemsEnvelope" } } } } }
    post:
      operationId: createMemberWork
      tags: [member]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MemberWorkRequest" } } } }
      responses: { "201": { description: Saved work, content: { application/json: { schema: { $ref: "#/components/schemas/ItemEnvelope" } } } } }
  /v1/member-work/{id}:
    get:
      operationId: getMemberWork
      tags: [member]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Saved work item, content: { application/json: { schema: { $ref: "#/components/schemas/ItemEnvelope" } } } } }
    patch:
      operationId: updateMemberWork
      tags: [member]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MemberWorkUpdateRequest" } } } }
      responses: { "200": { description: Updated work, content: { application/json: { schema: { $ref: "#/components/schemas/ItemEnvelope" } } } } }
  /v1/search:
    get:
      operationId: universalSearch
      tags: [search]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: limit, in: query, schema: { type: integer, maximum: 40 } }
      responses: { "200": { description: Search groups and results, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /v1/resource-work:
    get:
      operationId: listResourceWork
      tags: [resources]
      parameters: [{ name: includeCatalog, in: query, schema: { type: string, enum: ["1", "true"] } }]
      responses: { "200": { description: Saved resource work, content: { application/json: { schema: { $ref: "#/components/schemas/ItemsEnvelope" } } } } }
  /v1/resource-work/{resourceKey}:
    get:
      operationId: getResourceWork
      tags: [resources]
      parameters: [{ name: resourceKey, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Resource detail and work, content: { application/json: { schema: { type: object, required: [detail, work], properties: { detail: {}, work: {} } } } } } }
    put:
      operationId: saveResourceWork
      tags: [resources]
      parameters: [{ name: resourceKey, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ResourceWorkRequest" } } } }
      responses: { "200": { description: Saved resource work, content: { application/json: { schema: { $ref: "#/components/schemas/ItemEnvelope" } } } } }
  /v1/provider-resources:
    get:
      operationId: listProviderResources
      tags: [resources]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
      responses: { "200": { description: Provider resources, content: { application/json: { schema: { $ref: "#/components/schemas/ItemsEnvelope" } } } } }
    post:
      operationId: createProviderResource
      tags: [resources]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderResourceRequest" } } } }
      responses: { "201": { description: Created provider resource, content: { application/json: { schema: { $ref: "#/components/schemas/ItemEnvelope" } } } } }
  /v1/provider-resources/{id}:
    patch:
      operationId: updateProviderResource
      tags: [resources]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderResourceUpdateRequest" } } } }
      responses: { "200": { description: Updated provider resource, content: { application/json: { schema: { $ref: "#/components/schemas/ItemEnvelope" } } } } }
  /v1/sales-workflow/today:
    get:
      operationId: getSalesWorkflowToday
      tags: [sales]
      parameters:
        - { name: from, in: query, schema: { type: string, description: ISO-8601 timestamp transport value } }
        - { name: to, in: query, schema: { type: string, description: ISO-8601 timestamp transport value } }
      responses: { "200": { description: Today's workflow snapshot, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /v1/sales-workflow/accounts:
    get:
      operationId: listSalesWorkflowAccounts
      tags: [sales]
      responses: { "200": { description: Accounts, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /v1/medicare/provider-search:
    get:
      operationId: searchMedicareProviders
      tags: [medicare]
      parameters: [{ name: q, in: query, schema: { type: string } }, { name: state, in: query, schema: { type: string } }]
      responses: { "200": { description: Provider search result envelope, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /v1/medicare/intelligence:
    get:
      operationId: getMedicareIntelligence
      tags: [medicare]
      parameters: [{ name: ccn, in: query, schema: { type: string } }, { name: state, in: query, schema: { type: string } }]
      responses: { "200": { description: Intelligence result envelope, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /billing/status:
    get:
      operationId: getBillingStatus
      tags: [billing]
      responses:
        "200": { description: Billing status, content: { application/json: { schema: { $ref: "#/components/schemas/BillingStatus" } } } }
  /billing/checkout:
    post:
      operationId: createBillingCheckout
      tags: [billing]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingCheckoutInput" }
      responses:
        "200": { description: Checkout session, content: { application/json: { schema: { $ref: "#/components/schemas/BillingUrlResponse" } } } }
  /billing/portal:
    post:
      operationId: createBillingPortal
      tags: [billing]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingPortalInput" }
      responses:
        "200": { description: Billing portal session, content: { application/json: { schema: { $ref: "#/components/schemas/BillingUrlResponse" } } } }
  /billing/apple/catalog:
    get:
      operationId: getAppleBillingCatalog
      tags: [billing]
      responses:
        "200": { description: Public Apple product catalog, content: { application/json: { schema: { $ref: "#/components/schemas/AppleBillingCatalog" } } } }
  /billing/apple/config:
    get:
      operationId: getAppleBillingConfig
      tags: [billing]
      responses:
        "200": { description: Apple billing configuration, content: { application/json: { schema: { $ref: "#/components/schemas/AppleBillingConfig" } } } }
  /billing/apple/verify:
    post:
      operationId: verifyAppleBillingTransaction
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppleTransactionInput" }
      responses:
        "200": { description: Verified transaction, content: { application/json: { schema: { $ref: "#/components/schemas/AppleVerificationResult" } } } }
  /billing/apple/guest-verify:
    post:
      operationId: verifyGuestAppleBillingTransaction
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppleTransactionClaimInput" }
      responses:
        "200": { description: Preview transaction verification, content: { application/json: { schema: { $ref: "#/components/schemas/AppleVerificationResult" } } } }
  /billing/apple/claim:
    post:
      operationId: claimAppleBillingTransaction
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppleTransactionClaimInput" }
      responses:
        "200": { description: Claimed transaction, content: { application/json: { schema: { $ref: "#/components/schemas/AppleVerificationResult" } } } }
  /admin/access-requests:
    get:
      operationId: listAdminAccessRequests
      tags: [admin]
      responses:
        "200": { description: Access requests, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAccessRequestsResponse" } } } }
  /admin/access-requests/{id}/approve:
    post:
      operationId: approveAdminAccessRequest
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequestApprovalInput" } } } }
      responses: { "200": { description: Approved request, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAnyResponse" } } } } }
  /admin/access-requests/{id}/reject:
    post:
      operationId: rejectAdminAccessRequest
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequestRejectionInput" } } } }
      responses: { "200": { description: Rejected request, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAnyResponse" } } } } }
  /admin/access-requests/{id}/to-inquiry:
    post:
      operationId: convertAdminAccessRequestToInquiry
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Inquiry created, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAnyResponse" } } } } }
  /admin/access-requests/{id}/resend-invite:
    post:
      operationId: resendAdminAccessRequestInvite
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Invite resent, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAnyResponse" } } } } }
  /admin/organizations:
    get:
      operationId: listAdminOrganizations
      tags: [admin]
      responses: { "200": { description: Organizations, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOrganizationsResponse" } } } } }
  /admin/organizations/{id}:
    get:
      operationId: getAdminOrganization
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Organization detail, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAnyResponse" } } } } }
    patch:
      operationId: updateAdminOrganization
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationUpdateInput" } } } }
      responses: { "200": { description: Updated organization, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAnyResponse" } } } } }
  /admin/organizations/{id}/pipeline:
    patch:
      operationId: updateAdminOrganizationPipeline
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationPipelineInput" } } } }
      responses: { "200": { description: Updated pipeline, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAnyResponse" } } } } }
  /admin/organizations/{id}/notes:
    post:
      operationId: addAdminOrganizationNote
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationNoteInput" } } } }
      responses: { "200": { description: Updated notes, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAnyResponse" } } } } }
  /admin/organizations/{id}/status:
    patch:
      operationId: updateAdminOrganizationStatus
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationStatusInput" } } } }
      responses: { "200": { description: Updated status, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAnyResponse" } } } } }
  /admin/organizations/{id}/extend-trial:
    post:
      operationId: extendAdminOrganizationTrial
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/TrialExtensionInput" } } } }
      responses: { "200": { description: Trial extended, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAnyResponse" } } } } }
  /admin/organizations/{id}/billing/contract:
    post:
      operationId: createAdminOrganizationBillingContract
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BillingContractInput" } } } }
      responses: { "200": { description: Contract activated, content: { application/json: { schema: { $ref: "#/components/schemas/AdminAnyResponse" } } } } }
  /admin/organizations/{id}/billing/seats:
    patch:
      operationId: updateAdminOrganizationBillingSeats
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BillingSeatsInput" } } } }
