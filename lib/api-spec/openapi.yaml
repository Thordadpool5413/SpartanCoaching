openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: |
    Partial OpenAPI surface for SpartanCoaching.

    **Not the full product contract.** Authoritative routes live in
    `artifacts/api-server` (Express + Zod). See `docs/api-contract.md`.

    This file documents stable public endpoints used by web and mobile clients.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workspace
    description: Workspace guidance operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/workspace/next-move:
    get:
      operationId: getWorkspaceNextMove
      tags: [workspace]
      summary: Get the next recommended workspace move
      responses:
        "200":
          description: A privacy-safe next move recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceNextMoveResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        billingEmail:
          type: object
          description: Billing-email delivery health metrics.
          required: [hydrated, ok, failures1h, failures24h]
          properties:
            hydrated:
              type: boolean
            ok:
              type: boolean
            failures1h:
              type: number
            failures24h:
              type: number
      required:
        - status
    WorkspaceNextMoveResponse:
      type: object
      required: [recommendation, context, generatedAt]
      properties:
        recommendation:
          $ref: "#/components/schemas/WorkspaceNextMoveRecommendation"
        context:
          $ref: "#/components/schemas/WorkspaceNextMoveContext"
        generatedAt:
          type: string
          format: date-time
    WorkspaceNextMoveRecommendation:
      type: object
      required: [id, stage, title, description, reason, webHref, mobileHref]
      properties:
        id:
          type: string
        stage:
          type: string
          enum: [Prepare, Practice, Execute, Review]
        title:
          type: string
        description:
          type: string
        reason:
          type: string
        webHref:
          type: string
        mobileHref:
          type: string
    WorkspaceNextMoveContext:
      type: object
      required: [contextAvailable, hasJobRole, hasCommitment, hasDraftWork, hasReviewableWork, canUseElite, alsoLeadsTeam]
      properties:
        contextAvailable:
          type: boolean
        hasJobRole:
          type: boolean
        hasCommitment:
          type: boolean
        hasDraftWork:
          type: boolean
        hasReviewableWork:
          type: boolean
        canUseElite:
          type: boolean
        alsoLeadsTeam:
          type: boolean
