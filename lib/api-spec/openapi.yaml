openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: |
    Partial OpenAPI surface for SpartanCoaching.

    **Not the full product contract.** Authoritative routes live in
    `artifacts/api-server` (Express + Zod). See `docs/api-contract.md`.

    This file currently documents health only so Orval/codegen keeps working.
    Expand only for stable public endpoints; do not block features on full coverage.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
