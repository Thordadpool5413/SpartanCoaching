  <body>
    <script>
      // Aggressively clear any stale service workers and caches on every load
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        });
      }
      // Apply saved theme BEFORE React — must match lib/theme.ts presets
      (function () {
        try {
          var root = document.documentElement;
          var bg = localStorage.getItem('spartan_bg') || 'midnight';
          var surfaces = {
            default:  { tone: 'dark',  bg: '0 0% 7%',     fg: '0 0% 97%' },
            soft:     { tone: 'light', bg: '210 25% 98%', fg: '222 30% 10%' },
            warm:     { tone: 'light', bg: '40 45% 96%',  fg: '25 35% 10%' },
            cool:     { tone: 'light', bg: '200 35% 96%', fg: '210 35% 10%' },
            ink:      { tone: 'dark',  bg: '0 0% 0%',     fg: '0 0% 98%' },
            midnight: { tone: 'dark',  bg: '222 48% 9%',  fg: '214 40% 97%' },
            charcoal: { tone: 'dark',  bg: '0 0% 18%',    fg: '0 0% 98%' },
            forest:   { tone: 'dark',  bg: '152 28% 13%', fg: '140 25% 97%' }
          };
          /* Force cache-bust class so new CSS is obvious after deploy */
          root.classList.add('spartan-elite-2026');
          var s = surfaces[bg] || surfaces.midnight;
          var mode = s.tone;
          root.classList.toggle('dark', mode === 'dark');
          root.style.colorScheme = mode;
          root.style.setProperty('--background', s.bg);
          root.style.setProperty('--foreground', s.fg);
          root.style.backgroundColor = 'hsl(' + s.bg + ')';
          root.style.color = 'hsl(' + s.fg + ')';
          root.dataset.themeMode = mode;
          root.dataset.bg = bg;
          root.dataset.accent = localStorage.getItem('spartan_accent') || 'red';
        } catch (e) { /* private mode */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
