kind = "web"
previewPath = "/"
title = "Spartan Coaching"
version = "1.0.0"
id = "artifacts/spartan-coaching"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23436

[services.development]
run = "pnpm --filter @workspace/spartan-coaching run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/spartan-coaching", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/spartan-coaching", "run", "serve" ]

[services.env]
PORT = "23436"
BASE_PATH = "/"
