packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.21
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': 19.1.10
  '@types/react-dom': 19.1.7
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: 0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  vitest: 3.2.7
  wouter: ^3.3.5
  zod: ^3.25.76

minimumReleaseAge: 1440

# image-size GHSAs (GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq): no patched npm
# release yet (latest 2.0.2). Transitive via metro/@expo/cli only. Drop when fixed.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync
  # Security patches pulled via overrides for CI audit --audit-level high
  - brace-expansion
  - undici
  - fast-uri
  - ip-address
  - js-yaml
  - nanoid
  - image-size
  - tar

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

# Worklets babel plugin requires @babel/types at require-time; it is not always
# linked under the plugin package with pnpm isolation (Replit publish #fail).
packageExtensions:
  react-native-worklets@*:
    dependencies:
      "@babel/core": "*"
      "@babel/types": "*"
  babel-preset-expo@*:
    dependencies:
      "@babel/types": "*"

overrides:
  # Single React type root — prevents dual @types/react ref incompatibility on tsc.
  "@types/react": "19.1.10"
  "@types/react-dom": "19.1.7"
  # Keep brace-expansion major-compatible (RN codegen needs expand() from 1.x/2.x).
  # A flat pin of ALL majors to 5.x breaks iOS "Install pods" with:
  # TypeError: expand is not a function. Patch each major separately.
  # High: GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895 (CI pnpm audit --audit-level high)
  'brace-expansion@>=1.0.0 <2.0.0': 1.1.18
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.4
  'brace-expansion@>=3.0.0 <4.0.0': 3.0.3
  # No patched 4.x line — audit requires >=5.0.9 for the 4.x/5.x series.
  'brace-expansion@>=4.0.0 <5.0.0': 5.0.9
  'brace-expansion@>=5.0.0': 5.0.9
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  # jsdom (web vitest) pulls undici 7.x — GHSA-4cwx-7wf7-3272
  'undici@>=7.0.0 <7.29.0': 7.29.0
  # express-rate-limit → ip-address — GHSA-mwp4-54f8-5fhr
  'ip-address@<=10.3.0': 10.4.0
  # Expo CLI archive handling. GHSA-r292-9mhp-454m is fixed in 7.5.21.
  'tar@>=7.0.0 <7.5.21': 7.5.21
  # High: GHSA-5p4m-2wfm-xmqj (js-yaml !!omap quadratic CPU) — patch both majors
  'js-yaml@>=3.0.0 <3.15.1': 3.15.1
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  # High: GHSA-2v37-7h3g-55p8 — nanoid infinite loop when size is 0
  'nanoid@>=3.0.0 <3.3.17': 3.3.18
  'minimatch@>=5.0.0 <5.1.8': 5.1.8
  'postcss@<=8.5.17': 8.5.18
  # High: GHSA-fx2h-pf6j-xcff — vite server.fs.deny bypass (Windows ADS)
  # Keep every workspace package off vite 5.x / unpatched 6.x for CI audit.
  'vite@>=5.0.0 <6.0.0': 7.3.6
  'vite@>=6.0.0 <6.4.3': 6.4.3
  'vite@>=7.0.0 <7.3.2': 7.3.6
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
