name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Install gitleaks binary directly (avoids marketplace action download flakes).
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.24.3"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --redact --exit-code 1

  app-checks:
    name: Application typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PORT: "5000"
      BASE_PATH: "/"
      DATABASE_URL: "postgres://ci:ci@localhost:5432/ci"
      RUN_POSTGRES_INTEGRATION: "true"
      MIGRATION_ENVIRONMENT: "synthetic"
      AI_TOOL_ENCRYPTION_KEY: "BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc="
      # Non-secret stand-in only. Product code rejects placeholder keys as
      # PROVIDER_NOT_CONFIGURED (never attempts live OpenAI calls in CI).
      OPENAI_API_KEY: "ci-placeholder-no-network-calls"
      EXPO_PUBLIC_DOMAIN: "spartan-coaching-ci.invalid"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Schema: migrate-primary (numbered SQL + sales_workflow). No drizzle push in CI.
      - name: Apply SQL migrations (migrate-primary)
        run: pnpm --filter @workspace/db run migrate
      # Count-only metadata simulation; real recovery is a separate job.
      - name: Database count simulation (not recovery evidence)
        run: pnpm --filter @workspace/db run count-simulation
      - name: Ops readiness catalog tests
        run: pnpm --filter @workspace/db exec vitest run src/ops-readiness.test.ts
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/spartan-ai-tools test
      # Shared contracts: catalog, product analytics, client delivery (HSP-44)
      - name: Field-kit catalog contracts
        run: pnpm --filter @workspace/field-kit-catalog test
      - run: pnpm --filter @workspace/api-server test
      # Delivery / feature flags / client-config (HSP-44)
      - name: Delivery pipeline unit tests
        run: pnpm --filter @workspace/api-server exec vitest run --reporter verbose src/delivery/featureFlags.test.ts src/routes/health.test.ts src/routes/orgAdmin.test.ts
      # Wave 4 — frontend contracts (theme contrast, funnel CTA matrix, Day Zero, elite copy)
      - name: Wave 4 web contracts (spartan-coaching)
        run: pnpm --filter @workspace/spartan-coaching test
      - name: Native AI tool and account contracts
        run: pnpm --filter @workspace/spartan-coaching-mobile exec jest --runInBand
      - run: pnpm run build
      # Wave 4 — bundle size budgets after production build
      - name: Wave 4 performance budgets
        run: node scripts/performance-budget.mjs
      # HSP-48 — automated release gate (no live SITE_URL in CI)
      - name: Release gate automated suites
        run: node scripts/release-gate.mjs

  browser-release-gate:
    name: Browser release gate
    needs: app-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Test desktop and mobile customer journeys
        run: pnpm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-release-evidence
          path: |
            playwright-report
            test-results/playwright
          retention-days: 14

  migration-equivalence:
    name: Synthetic migration equivalence (P02)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_ENVIRONMENT: synthetic
      RUN_MIGRATION_INTEGRATION: "true"
      MIGRATION_TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db test
      - name: Preserve content-free catalog discrepancy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-migration-equivalence
          path: lib/db/migration-equivalence-report.json
          if-no-files-found: warn
          retention-days: 7

  synthetic-recovery:
    name: Independent synthetic database recovery (P03)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RECOVERY_ENVIRONMENT: synthetic
      RECOVERY_TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install matching PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Restore synthetic dump and verify isolation, content and recovery guards
        run: pnpm --filter @workspace/db run backup-restore-drill
      - name: Preserve content-free recovery measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-recovery-evidence
          path: lib/db/synthetic-recovery-report.json
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  # Preserve the existing required-check name and fail if ANY gate is not green.
  # Independent jobs collect all evidence even when the audit or schema gate fails.
  verify:
    name: Typecheck, test, and build
    if: always()
    needs:
      - app-checks
      - dependency-audit
      - secret-scan
      - migration-equivalence
      - synthetic-recovery
      - browser-release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification gate to pass
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.GATE_RESULTS);
          const failed = Object.entries(results).filter(([, job]) => job.result !== 'success');
          for (const [name, job] of failed) console.error(`${name}: ${job.result}`);
          if (failed.length) process.exit(1);
          console.log('All required verification gates passed.');
          NODE
